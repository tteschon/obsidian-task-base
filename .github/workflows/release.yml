name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  # Artifact attestations let anyone cryptographically verify a release asset
  # was built from this repository by this workflow, rather than uploaded by
  # hand. Both of these are required to mint one.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Obsidian matches a release to a plugin by the version in manifest.json,
      # so a tag that disagrees with it produces a release nothing can install.
      - name: Tag must match manifest version
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != manifest.json $manifest" >&2
            exit 1
          fi
          node -e "
            const v = require('./versions.json');
            if (!v['$GITHUB_REF_NAME']) {
              console.error('versions.json has no entry for $GITHUB_REF_NAME');
              process.exit(1);
            }
          "

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
      # main.js, manifest.json and styles.css as loose assets is the layout
      # Obsidian's installer and BRAT expect — not a zip.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
